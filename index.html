
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi biblioteca de presentaciones</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 60px 8%;
    background: #101827;
    color: #f8fafc;
    font-family: Arial, sans-serif;
  }

  .eyebrow {
    color: #5eead4;
    letter-spacing: 3px;
    font-size: 12px;
  }

  h1 {
    font-size: clamp(32px, 5vw, 64px);
    letter-spacing: -2px;
    margin-bottom: 12px;
  }

  .intro { color: #94a3b8; }

  .grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(250px, 1fr));
    gap: 24px;
    margin-top: 48px;
  }

  .card {
    display: block;
    color: inherit;
    text-decoration: none;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 30px;
    transition: transform .25s, border-color .25s;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: #5eead4;
  }

  .number { color: #5eead4; }

  .card p { color: #94a3b8; }

  .link { color: #5eead4; }
</style>
</head>

<body>
  <p class="eyebrow">PORTAFOLIO ACADÉMICO</p>
  <h1>Mis presentaciones.</h1>
  <p class="intro">
    Un espacio para explorar mis proyectos y exposiciones.
  </p>

  <main class="grid">

    <a class="card"
       href="presentaciones/responsabilidad-social/">
      <span class="number">PROYECTO 01</span>
      <h2>Responsabilidad social</h2>
      <p>Empresas, sostenibilidad y stakeholders.</p>
      <span class="link">Ver presentación →</span>
    </a>

    <a class="card"
       href="presentaciones/inteligencia-artificial/">
      <span class="number">PROYECTO 02</span>
      <h2>Inteligencia artificial</h2>
      <p>Innovación y transformación empresarial.</p>
      <span class="link">Ver presentación →</span>
    </a>

  </main>
</body>
</html>
